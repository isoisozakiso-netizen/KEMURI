name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # This project is dependency-light vanilla JS (Cloudflare Worker).
      # The scripts below use only Node.js built-ins, so no install is required.
      - name: Lint (syntax check)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build / validate
        run: npm run build
